[start]
command:/usr/local/etc/rc.d/netdash start
parameters:
type:script
message:starting netdash

[stop]
command:/usr/local/etc/rc.d/netdash stop
parameters:
type:script
message:stopping netdash

[restart]
command:/usr/local/etc/rc.d/netdash stop; /usr/local/etc/rc.d/netdash start
parameters:
type:script
message:restarting netdash
description:Restart netdash (network dashboard)

[status]
command:/usr/local/etc/rc.d/netdash status; exit 0
parameters:
type:script_output
message:request netdash status
